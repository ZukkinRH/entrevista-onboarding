<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zukkin RH</title>
    <!-- Pré-aquece DNS + TCP + TLS com Firestore antes do Firebase SDK terminar de carregar. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #D42027;
            --primary-light: #E85B5B;
            --primary-dark: #B01A20;
            --secondary: #333333;
            --danger: #D63031;
            --warning: #FDCB6E;
            --info: #0984E3;
            --light: #F8F8F8;
            --dark: #2D2D2D;
            --border: #E0E0E0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Login Styles */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)),
                        url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .login-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-top: 4px solid var(--primary);
        }

        .login-box h1 {
            color: var(--primary);
            margin-bottom: 10px;
            text-align: center;
        }

        .login-box p {
            color: #636E72;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 32, 39, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(212,32,39,0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212,32,39,0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #BE2C15;
        }

        .btn-small {
            padding: 6px 14px;
            font-size: 12px;
            width: auto;
            display: inline-block;
            min-width: 0;
        }

        .forgot-password-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
        }

        .forgot-password-link a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }

        /* Main App Styles */
        .app-container {
            display: flex;
            min-height: 100vh;
            background: #f0f2f5;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-right: none;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #fff;
        }

        .user-info {
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 13px;
        }

        .user-info p {
            margin: 5px 0;
            color: rgba(255,255,255,0.7);
        }

        .user-info strong {
            color: #fff;
        }

        .nav-menu {
            list-style: none;
            flex: 1;
        }

        .nav-menu li {
            margin-bottom: 8px;
        }

        .nav-menu a {
            display: block;
            padding: 12px 16px;
            border-radius: 6px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .nav-menu a:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }

        .nav-menu a.active {
            background: rgba(212,32,39,0.9);
            color: #fff;
            font-weight: 600;
            border-left: 3px solid #fff;
        }

        .logout-btn {
            width: 100%;
            margin-top: auto;
            padding: 10px;
            flex-shrink: 0;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.8);
        }

        .logout-btn:hover {
            border-color: var(--primary);
            color: #fff;
            background: rgba(212,32,39,0.2);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: #f0f2f5;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-header h1 {
            color: var(--dark);
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 20px;
            border: none;
            background: none;
            border-bottom: 3px solid transparent;
            color: #636E72;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .tab-btn:hover {
            color: var(--primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: transform .2s, box-shadow .2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-primary {
            background: rgba(212, 32, 39, 0.2);
            color: var(--primary);
        }

        .badge-secondary {
            background: rgba(51, 51, 51, 0.1);
            color: var(--secondary);
        }

        .badge-danger {
            background: rgba(214, 48, 49, 0.2);
            color: var(--danger);
        }

        .badge-warning {
            background: rgba(253, 203, 110, 0.2);
            color: #D68910;
        }

        .badge-pendente {
            background: rgba(253, 203, 110, 0.2);
            color: #D68910;
        }

        .badge-em_andamento {
            background: rgba(9, 132, 227, 0.2);
            color: var(--info);
        }

        .badge-concluido {
            background: rgba(0, 184, 148, 0.2);
            color: #00B894;
        }

        .badge-cancelado {
            background: rgba(214, 48, 49, 0.2);
            color: var(--danger);
        }

        /* ── Plano de Acompanhamento ── */
        .evo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .evo-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .evo-stat-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .evo-stat-card .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }
        .evo-stat-card .stat-label {
            font-size: 11px;
            color: #636E72;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .evo-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .evo-card:hover {
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        .evo-card-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .evo-card-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 6px;
        }
        .evo-card-info p {
            font-size: 13px;
            color: #636E72;
            margin: 0;
        }
        .evo-card-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .evo-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .evo-badge-cargo { background: #e8eaf6; color: #283593; }
        .evo-badge-depto { background: #e0f2f1; color: #00695c; }
        .evo-badge-tempo { background: #fff3e0; color: #e65100; }
        .evo-card-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .evo-card-bottom {
            background: #f8f9fa;
            padding: 14px 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: #636E72;
        }
        .evo-card-bottom .evo-metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .evo-card-bottom .evo-metric strong {
            color: var(--dark);
        }
        /* Tabs dentro do plano do colaborador */
        .evo-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .evo-tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #636E72;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .evo-tab-btn:hover { color: var(--primary); }
        .evo-tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .evo-section { display: none; }
        .evo-section.active { display: block; }
        /* Competências */
        .comp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .comp-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border);
        }
        .comp-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .comp-card-header h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }
        .comp-level {
            display: flex;
            gap: 3px;
        }
        .comp-level-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e0e0e0;
        }
        .comp-level-dot.filled { background: var(--primary); }
        .comp-level-label {
            font-size: 11px;
            color: #636E72;
            margin-top: 4px;
        }
        /* Metas */
        .meta-item {
            background: white;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .meta-item .meta-info {
            flex: 1;
        }
        .meta-item .meta-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            margin: 0 0 4px;
        }
        .meta-item .meta-info p {
            font-size: 12px;
            color: #636E72;
            margin: 0;
        }
        .meta-progress {
            width: 60px;
            text-align: center;
        }
        .meta-progress .pct {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }
        .meta-progress .pct-label {
            font-size: 10px;
            color: #636E72;
        }
        /* Timeline / Marcos */
        .evo-timeline {
            position: relative;
            padding-left: 28px;
        }
        .evo-timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }
        .evo-timeline-item {
            position: relative;
            padding: 14px 0;
        }
        .evo-timeline-item::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 2px var(--border);
        }
        .evo-timeline-item.tipo-avaliacao::before { background: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
        .evo-timeline-item.tipo-meta::before { background: #2e7d32; box-shadow: 0 0 0 2px #2e7d32; }
        .evo-timeline-item.tipo-competencia::before { background: #1565c0; box-shadow: 0 0 0 2px #1565c0; }
        .evo-timeline-item.tipo-marco::before { background: #f57f17; box-shadow: 0 0 0 2px #f57f17; }
        .evo-timeline-item.tipo-feedback::before { background: #7b1fa2; box-shadow: 0 0 0 2px #7b1fa2; }
        .evo-timeline-item .tl-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .evo-timeline-item .tl-tipo {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tl-tipo-avaliacao { background: #ffebee; color: #c62828; }
        .tl-tipo-meta { background: #e8f5e9; color: #2e7d32; }
        .tl-tipo-competencia { background: #e3f2fd; color: #1565c0; }
        .tl-tipo-marco { background: #fff8e1; color: #f57f17; }
        .tl-tipo-feedback { background: #f3e5f5; color: #7b1fa2; }
        .evo-timeline-item .tl-date {
            font-size: 11px;
            color: #999;
        }
        .evo-timeline-item .tl-author {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
        }
        .evo-timeline-item .tl-text {
            font-size: 13px;
            color: #555;
            margin-top: 4px;
            line-height: 1.5;
        }
        /* Avaliações periódicas */
        .aval-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .aval-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .aval-card-header h4 {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
        }
        .aval-card-header .aval-date {
            font-size: 12px;
            color: #636E72;
        }
        .aval-nota {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 20px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 8px;
        }
        .aval-nota.alta { background: #e8f5e9; color: #2e7d32; }
        .aval-nota.media { background: #fff8e1; color: #f57f17; }
        .aval-nota.baixa { background: #ffebee; color: #c62828; }
        .form-section {
            margin-bottom: 16px;
        }
        .form-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--dark);
            font-size: 13px;
        }
        .form-section input,
        .form-section textarea,
        .form-section select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        .form-section textarea {
            resize: vertical;
            min-height: 70px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            background: #f8f9fa;
            padding: 10px 8px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            font-size: 13px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        .table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .table tr:hover {
            background: var(--light);
        }

        .table tr:nth-child(even) {
            background: #fafbfc;
        }

        .table .actions-cell {
            white-space: nowrap;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-start;
        }

        .table .actions-cell .btn,
        .table .actions-cell .btn-small {
            width: auto;
            flex: 0 0 auto;
        }

        .scale-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .scale-btn {
            width: 45px;
            height: 45px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: white;
            color: var(--dark);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scale-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .scale-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .nps-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .nps-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nps-btn:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .nps-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .textárea-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }

        .textárea-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 32, 39, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-item input[type="radio"] {
            cursor: pointer;
        }

        .radio-item label {
            margin: 0;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn .3s ease;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            color: var(--primary);
            border-left: 4px solid var(--primary);
            padding-left: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #636E72;
        }

        .close-btn:hover {
            color: var(--dark);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #636E72;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(0, 184, 148, 0.1);
            color: var(--secondary);
            border: 1px solid rgba(0, 184, 148, 0.3);
        }

        .alert-error {
            background: rgba(214, 48, 49, 0.1);
            color: var(--danger);
            border: 1px solid rgba(214, 48, 49, 0.3);
        }

        .alert-info {
            background: rgba(9, 132, 227, 0.1);
            color: var(--info);
            border: 1px solid rgba(9, 132, 227, 0.3);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .collaborator-select {
            margin-bottom: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .collaborator-select label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .collaborator-select select {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: rgba(255,255,255,0.8);
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .sidebar-toggle:hover {
            background: rgba(255,255,255,0.1);
        }

        .sidebar.collapsed {
            width: 60px;
            padding: 20px 10px;
        }

        .sidebar.collapsed .sidebar-header h2,
        .sidebar.collapsed .user-info,
        .sidebar.collapsed .nav-menu a span,
        .sidebar.collapsed .logout-btn span {
            display: none;
        }

        .sidebar.collapsed .nav-menu a {
            text-align: center;
            padding: 12px 8px;
            font-size: 18px;
        }

        .sidebar.collapsed .sidebar-header {
            justify-content: center;
        }

        .progress-bar {
            height: 8px;
            background: #E0E0E0;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-0 {
            background: var(--warning);
        }

        .progress-50 {
            background: var(--info);
        }

        .progress-100 {
            background: #00B894;
        }

        .update-item {
            border-left: 3px solid var(--primary);
            padding-left: 12px;
            margin: 10px 0;
            padding: 10px 0 10px 12px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 22px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform .2s, box-shadow .2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .stat-card .stat-icon {
            width: 52px; height: 52px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0;
        }
        .stat-card .stat-icon.blue { background: #e3f2fd; color: #1565c0; }
        .stat-card .stat-icon.green { background: #e8f5e9; color: #2e7d32; }
        .stat-card .stat-icon.orange { background: #fff3e0; color: #e65100; }
        .stat-card .stat-icon.red { background: #ffebee; color: #c62828; }
        .stat-card .stat-icon.purple { background: #f3e5f5; color: #7b1fa2; }
        .stat-card .stat-info { flex: 1; }

        .stat-card h3 {
            color: var(--dark);
            font-size: 26px;
            margin: 0 0 2px 0;
            line-height: 1;
        }

        .stat-card p {
            color: #636E72;
            font-size: 13px;
            margin: 0;
        }

        .dash-section {
            background: white; border-radius: 12px; padding: 24px;
            border: 1px solid var(--border); box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .dash-section-title {
            font-size: 16px; font-weight: 700; color: var(--dark);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .dash-charts-row {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 20px; margin-bottom: 20px;
        }
        @media (max-width: 900px) { .dash-charts-row { grid-template-columns: 1fr; } }
        .dash-chart-card {
            background: white; border-radius: 12px; padding: 20px;
            border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .dash-chart-card h4 {
            font-size: 14px; font-weight: 600; color: #636E72;
            margin-bottom: 12px;
        }
        .dash-chart-card .chart-wrap {
            position: relative; width: 100%; height: 250px;
        }
        .activity-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid #f0f0f0;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--primary); color: #fff; display: flex;
            align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; flex-shrink: 0;
        }
        .activity-info { flex: 1; }
        .activity-info .activity-name { font-weight: 600; font-size: 14px; color: var(--dark); }
        .activity-info .activity-detail { font-size: 12px; color: #636E72; margin-top: 2px; }
        .activity-date { font-size: 12px; color: #aaa; white-space: nowrap; }
        .dash-empty { text-align: center; padding: 30px; color: #aaa; font-size: 14px; }

        .form-section {
            margin-bottom: 25px;
        }

        .form-section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .question-group {
            margin-bottom: 20px;
        }

        .question-label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--dark);
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 15px;
            }

            .sidebar.collapsed {
                width: 0;
                padding: 0;
                overflow: hidden;
            }

            .user-info {
                display: none;
            }

            .nav-menu {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .nav-menu li {
                margin: 0;
            }

            .main-content {
                padding: 20px;
            }

            .tabs {
                gap: 10px;
            }

            .tab-btn {
                padding: 10px 15px;
                font-size: 12px;
            }
        }

        /* ===== Toast Notifications ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            min-width: 320px;
            max-width: 440px;
            padding: 14px 20px 14px 16px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,.18);
            animation: toastIn .35s ease-out;
            position: relative;
        }
        .toast.toast-out { animation: toastOut .3s ease-in forwards; }
        .toast-success { background: linear-gradient(135deg, #2e7d32, #43a047); }
        .toast-error   { background: linear-gradient(135deg, #c62828, #e53935); }
        .toast-info    { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .toast-warn    { background: linear-gradient(135deg, #e65100, #fb8c00); }
        .toast-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
        .toast-body { flex: 1; }
        .toast-title { font-weight: 700; margin-bottom: 2px; }
        .toast-msg { opacity: .92; font-size: 13px; }
        .toast-close {
            position: absolute; top: 8px; right: 10px;
            background: none; border: none; color: rgba(255,255,255,.7);
            font-size: 18px; cursor: pointer; padding: 0; line-height: 1;
        }
        .toast-close:hover { color: #fff; }
        @keyframes toastIn { from { opacity:0; transform:translateX(60px); } to { opacity:1; transform:translateX(0); } }
        @keyframes toastOut { to { opacity:0; transform:translateX(60px); } }

        /* ===== Tela de Redefinição de Senha ===== */
        .reset-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)),
                        url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .reset-card {
            background: #fff; border-radius: 16px; padding: 40px;
            box-shadow: 0 12px 40px rgba(0,0,0,.12);
            max-width: 440px; width: 92%;
        }
        .reset-card .logo { color: var(--primary); font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .reset-card .subtitle { color: #636E72; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
        .reset-card .field { margin-bottom: 18px; position: relative; }
        .reset-card .field label { display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px; }
        .reset-card .field input {
            width: 100%; padding: 12px 42px 12px 14px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; transition: border-color .2s;
            box-sizing: border-box; outline: none;
        }
        .reset-card .field input:focus { border-color: var(--primary); }
        .reset-card .eye-btn {
            position: absolute; right: 12px; top: 35px;
            background: none; border: none; color: #999; cursor: pointer; font-size: 16px; padding: 4px;
        }
        .reset-card .eye-btn:hover { color: #333; }
        .strength-bar { height: 4px; border-radius: 2px; background: #e0e0e0; margin-top: 8px; overflow: hidden; }
        .strength-bar-fill { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0%; }
        .strength-text { font-size: 11px; margin-top: 4px; color: #999; }
        .reset-card .btn-submit {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: var(--primary); color: #fff; font-size: 15px;
            font-weight: 700; cursor: pointer; transition: background .2s;
            margin-top: 8px;
        }
        .reset-card .btn-submit:hover { background: var(--primary-dark); }
        .reset-card .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        /* ===== Confirm Dialog ===== */
        .confirm-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,.45); display: flex; align-items: center;
            justify-content: center; z-index: 99998; animation: fadeIn .2s;
        }
        .confirm-box {
            background: #fff; border-radius: 14px; padding: 30px; max-width: 400px;
            width: 90%; box-shadow: 0 12px 40px rgba(0,0,0,.2); text-align: center;
        }
        .confirm-box .confirm-icon { font-size: 44px; margin-bottom: 12px; }
        .confirm-box .confirm-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .confirm-box .confirm-msg { font-size: 14px; color: #636E72; line-height: 1.5; margin-bottom: 24px; }
        .confirm-box .confirm-actions { display: flex; gap: 10px; }
        .confirm-box .confirm-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .confirm-box .btn-cancel-confirm { background: #f0f0f0; color: #333; }

        /* Import Preview */
        .import-preview-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
        .import-preview-table th { background: var(--primary); color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; }
        .import-preview-table td { padding: 7px 10px; border-bottom: 1px solid #eee; }
        .import-preview-table tr:nth-child(even) { background: #f9f9f9; }
        .import-preview-table .row-error { background: #fff5f5; }
        .import-preview-table .cell-error { color: #c62828; font-weight: 600; }
        .import-preview-table .cell-ok { color: #2e7d32; }
        .import-stats { display: flex; gap: 16px; margin: 12px 0; flex-wrap: wrap; }
        .import-stat { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .import-stat-ok { background: #e8f5e9; color: #2e7d32; }
        .import-stat-err { background: #ffebee; color: #c62828; }
        .import-stat-total { background: #e3f2fd; color: #1565c0; }
        .import-progress { margin: 16px 0; }
        .import-progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .import-progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; width: 0%; }
        .import-progress-text { font-size: 12px; color: #636E72; margin-top: 6px; text-align: center; }
        .confirm-box .btn-cancel-confirm:hover { background: #e0e0e0; }
        .confirm-box .btn-confirm-action { background: var(--primary); color: #fff; }
        .confirm-box .btn-confirm-action:hover { background: var(--primary-dark); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Fichas */
        .ficha-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .ficha-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 20px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
        }
        .ficha-card:hover {
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        .ficha-card-top {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
        }
        .ficha-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
        }
        .ficha-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ficha-info h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--dark);
            margin: 0 0 2px;
        }
        .ficha-info p {
            font-size: 12px;
            color: #636E72;
            margin: 0;
        }
        .ficha-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .ficha-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
        }
        .ficha-search {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .ficha-search input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }
        /* View ficha detail */
        .ficha-detail-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .ficha-detail-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
        }
        .ficha-detail-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ficha-detail-info h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }
        .ficha-detail-info p {
            margin: 0;
            color: #636E72;
            font-size: 13px;
        }
        .ficha-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .ficha-detail-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        .ficha-detail-item label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #636E72;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }
        .ficha-detail-item p {
            font-size: 14px;
            color: var(--dark);
            margin: 0;
        }
        /* Promoção */
        .promo-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 14px;
            transition: all 0.2s;
        }
        .promo-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .promo-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .promo-card-header h3 {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
        }
        .promo-counts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .promo-count-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .promo-tipo-ponto_positivo { background: #e8f5e9; color: #2e7d32; }
        .promo-tipo-ponto_negativo { background: #ffebee; color: #c62828; }
        .promo-tipo-inconsistencia_ponto { background: #fff8e1; color: #f57f17; }
        .promo-tipo-feedback { background: #f3e5f5; color: #7b1fa2; }
        .promo-timeline-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #ccc;
        }
        .promo-timeline-item.tipo-ponto_positivo { border-left-color: #2e7d32; background: #f9fdf9; }
        .promo-timeline-item.tipo-ponto_negativo { border-left-color: #c62828; background: #fff9f9; }
        .promo-timeline-item.tipo-inconsistencia_ponto { border-left-color: #f57f17; background: #fffdf5; }
        .promo-timeline-item.tipo-feedback { border-left-color: #7b1fa2; background: #fdf5ff; }
        .promo-timeline-item .promo-tipo-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .promo-timeline-item .promo-text {
            font-size: 13px;
            color: #333;
            line-height: 1.5;

        const firebaseConfig = {
            apiKey: "AIzaSyAydCEQFyCmvcb-iTxovo6Pzpwp-8vraYM",

            projectId: "zukkin-rh",

        // ============================================================
        // FIRESTORE LAZY INIT — o SDK é pesado e bloqueia a thread.
        // Inicializamos SOMENTE quando a primeira query for necessária.
        // A tela de login aparece instantaneamente, sem depender do SDK.
        // ============================================================
        let _db = null;
        let _dbReady = null;

        function getDb() {
            if (_db) return Promise.resolve(_db);
            if (_dbReady) return _dbReady;
            _dbReady = new Promise((resolve) => {
                function tryInit() {
                    if (typeof firebase !== 'undefined' && firebase.firestore) {
                        try {
                            firebase.initializeApp(firebaseConfig);
                        } catch(_) {} // already initialized
                        _db = firebase.firestore();
                        resolve(_db);
                    } else {
                        setTimeout(tryInit, 100);
                    }
                }
                tryInit();
            });
            return _dbReady;
        }

        // Compat: `db.collection(...)` funciona mesmo antes do SDK carregar.
        // TUDO é async — NUNCA bloqueia a thread.
        const db = {
            collection: function(name) {
                return {
                    get: () => getDb().then(d => d.collection(name).get()),
                    add: (data) => getDb().then(d => d.collection(name).add(data)),
                    where: function() {
                        const a = Array.from(arguments);
                        return {
                            get: () => getDb().then(d => d.collection(name).where(...a).get()),
                            where: function() {
                                const b = Array.from(arguments);
                                return {
                                    get: () => getDb().then(d => d.collection(name).where(...a).where(...b).get())
                                };
                            }
                        };
                    },
                    orderBy: function() {
                        const a = Array.from(arguments);
                        return {
                            limit: function(n) {
                                return {
                                    get: () => getDb().then(d => d.collection(name).orderBy(...a).limit(n).get())
                                };
                            },
                            get: () => getDb().then(d => d.collection(name).orderBy(...a).get())
                        };
                    },
                    doc: function(id) {
                        return {
                            get: () => getDb().then(d => d.collection(name).doc(id).get()),
                            update: (data) => getDb().then(d => d.collection(name).doc(id).update(data)),
                            delete: () => getDb().then(d => d.collection(name).doc(id).delete()),
                            ref: { update: (data) => getDb().then(d => d.collection(name).doc(id).update(data)) }
                        };
                    }
                };
            },
            settings: function() {}
        };

        // Helper: query com timeout (evita travar se Firestore não responder)
        function withTimeout(promise, ms) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), ms))
            ]);
        }

        // --- localStorage cache helpers ---
        function lsGet(key) {
            try {
                const raw = localStorage.getItem('zrh_' + key);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch(_) { return null; }
        }
        function lsSet(key, docs) {
            try {
                localStorage.setItem('zrh_' + key, JSON.stringify(docs));
            } catch(_) {}
        }
        function lsClear(prefix) {
            try {
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith('zrh_' + (prefix || ''))) keys.push(k);
                }
                keys.forEach(k => localStorage.removeItem(k));
            } catch(_) {}
        }

        // Converte snapshot do Firestore em array serializável
        function snapToArray(snap) {
            const arr = [];
            snap.forEach(doc => {
                const d = doc.data();
                // Converte Timestamps para ISO string
                for (const k in d) {
                    if (d[k] && typeof d[k].toDate === 'function') {
                        d[k] = d[k].toDate().toISOString();
                    }
                }
                arr.push({ id: doc.id, ...d });
            });
            return arr;
        }

        // Cria um "fake snapshot" a partir do array do localStorage
        // compatível com o padrão snap.forEach(doc => { doc.id, doc.data() })
        function arrayToFakeSnap(arr) {
            if (!arr) return null;
            return {
                empty: arr.length === 0,
                size: arr.length,
                docs: arr.map(item => ({
                    id: item.id,
                    data: () => {
                        const copy = { ...item };
                        delete copy.id;
                        return copy;
                    }
                })),
                forEach: function(fn) { this.docs.forEach(fn); }
            };
        }

        // --- Cache em memória (sessão atual) ---
        const _cache = new Map();
        function invalidateCache(prefix) {
            if (!prefix) { _cache.clear(); lsClear(''); return; }
            for (const k of Array.from(_cache.keys())) if (k.startsWith(prefix)) _cache.delete(k);
            lsClear(prefix);
        }

        // CORE: busca com stale-while-revalidate
        // 1. Retorna localStorage imediatamente se tiver dados
        // 2. Dispara Firestore em background
        // 3. Quando Firestore responder, salva em localStorage e memória
        async function cachedGet(key, fetcher) {
            // 1. Check memória (mais rápido)
            const memHit = _cache.get(key);
            if (memHit) return memHit;

            // 2. Check localStorage (instantâneo, sobrevive refresh)
            const lsData = lsGet(key);
            const fakeSnap = arrayToFakeSnap(lsData);

            // 3. Dispara Firestore com timeout de 8s
            const firestorePromise = Promise.race([
                fetcher().then(snap => {
                    // Salva no localStorage e memória para próxima vez
                    lsSet(key, snapToArray(snap));
                    _cache.set(key, snap);
                    return snap;
                }),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('timeout')), 8000)
                )
            ]).catch(err => {
                console.warn('Firestore lento/offline para', key, err.message || err);
                return null;
            });

            // 4. Se temos dados no localStorage, retorna imediatamente
            if (fakeSnap) {
                _cache.set(key, fakeSnap);
                // Background: atualiza quando Firestore responder
                firestorePromise.then(snap => {
                    if (snap) _cache.set(key, snap);
                });
                return fakeSnap;
            }

            // 5. Sem cache: espera Firestore (primeira vez)
            const result = await firestorePromise;
            if (result) {
                _cache.set(key, result);
                return result;
            }

            // 6. Fallback: snapshot vazio
            return arrayToFakeSnap([]);

        async function handleLogin(event) {
            event.preventDefault();
            const email = normalizeEmail(document.getElementById('loginEmail').value);
            const password = document.getElementById('loginPassword').value;

            // 1) Tentativa normal via Firestore (com timeout de 6s)
            try {
                const users = await withTimeout(
                    db.collection('usuarios').where('email', '==', email).get(), 6000
                );

                if (!users.empty) {
                    const user = users.docs[0];
                    const userData = user.data();
                    const hashedPassword = hashSenha(password);

                    if (userData.senha === hashedPassword) {
                        if (userData.perfil === 'colaborador') {
                            showToast('error', 'Acesso restrito', 'Acesso restrito a gestores e equipe de RH.');
                            return;
                        }
                        currentUser = { id: user.id, ...userData };
                        lsSet('session', currentUser);
                        // Verifica senha provisória
                        if (userData.provisoria) {
                            showChangePasswordScreen(user.id);
                            return;
                        }
                        showAppScreen();
                        return;
                    }

                    // Permite fallback do admin mesmo se o doc tem hash diferente
                    if (email === FALLBACK_ADMIN_EMAIL && password === FALLBACK_ADMIN_PASSWORD) {
                        // Restaura a senha padrão no doc existente
                        try { await user.ref.update({ senha: hashSenha(FALLBACK_ADMIN_PASSWORD), ativo: true }); } catch (_) {}
                        currentUser = { id: user.id, ...userData, perfil: 'admin', ativo: true };
                        lsSet('session', currentUser);
                        showAppScreen();
                        return;
                    }

                    showToast('error', 'Senha incorreta', 'Verifique sua senha e tente novamente.');
                    return;
                }
            } catch (error) {
                console.error('Erro ao consultar usuário:', error);
                // Timeout ou erro de rede — cai no fallback admin se for o admin
                if (!(email === FALLBACK_ADMIN_EMAIL && password === FALLBACK_ADMIN_PASSWORD)) {
                    showToast('error', 'Erro no login',
                        error.message === 'TIMEOUT'
                        ? 'Servidor demorou para responder. Tente novamente.'
                        : error.message);
                    return;
                }
            }

            // 2) FALLBACK: admin de emergência
            if (email === FALLBACK_ADMIN_EMAIL && password === FALLBACK_ADMIN_PASSWORD) {
                let adminId = 'admin-fallback';
                try {
                    const ref = await db.collection('usuarios').add({
                        nome: 'Administrador',
                        email: FALLBACK_ADMIN_EMAIL,
                        senha: hashSenha(FALLBACK_ADMIN_PASSWORD),
                        perfil: 'admin',
                        ativo: true,
                        data_criacao: new Date()
                    });
                    adminId = ref.id;
                    invalidateCache('usuarios:');
                } catch (e) {
                    console.warn('Não foi possível recriar admin no Firestore, seguindo em modo emergência:', e);
                }
                currentUser = {
                    id: adminId,
                    nome: 'Administrador',
                    email: FALLBACK_ADMIN_EMAIL,
                    perfil: 'admin',
                    ativo: true
                };
                lsSet('session', currentUser);
                showAppScreen();
                return;
            }

            showToast('error', 'Não encontrado', 'Usuário não encontrado. Verifique o email digitado.');
        }

        // Converte qualquer valor de data (Firestore Timestamp, string ISO, Date, {seconds}) para string pt-BR
        function formatDate(val) {
            if (!val) return 'N/A';
            try {
                // Firestore Timestamp com .toDate()
                if (typeof val.toDate === 'function') return val.toDate().toLocaleDateString('pt-BR');
                // Objeto com seconds (Timestamp serializado no cache)
                if (val.seconds) return new Date(val.seconds * 1000).toLocaleDateString('pt-BR');
                // String ISO ou Date
                const d = new Date(val);
                if (isNaN(d.getTime())) return 'N/A';
                return d.toLocaleDateString('pt-BR');
            } catch(_) { return 'N/A'; }
        }

        // Converte qualquer valor de data para Date object (para ordenação)
        function toDate(val) {
            if (!val) return new Date(0);
            try {
                if (typeof val.toDate === 'function') return val.toDate();
                if (val.seconds) return new Date(val.seconds * 1000);
                const d = new Date(val);
                return isNaN(d.getTime()) ? new Date(0) : d;
            } catch(_) { return new Date(0); }
        }

        function hashSenha(senha) {
            return CryptoJS.SHA256(senha).toString();

        function renderQuestion(question, surveyType) {
            const questionId = surveyType + '_' + question.id;

                let html = '<div class="question-group">';
                html += '<label class="question-label">' + question.texto + '</label>';
                html += '<div class="scale-buttons">';

                }
                html += '</div>';
                html += '<input type="hidden" id="' + questionId + '" value="">';
                html += '</div>';
                return html;
            } else if (question.tipo === 'sim_nao') {
                let html = '<div class="question-group">';
                html += '<label class="question-label">' + question.texto + '</label>';
                html += '<div class="radio-group">';
                html += '<div class="radio-item">';
                html += '<input type="radio" id="' + questionId + '_yes" name="' + questionId + '" value="sim" onchange="selectOption(\'' + questionId + '\', \'sim\')">';
                html += '<label for="' + questionId + '_yes">Sim</label>';
                html += '</div>';
                html += '<div class="radio-item">';
                html += '<input type="radio" id="' + questionId + '_no" name="' + questionId + '" value="nao" onchange="selectOption(\'' + questionId + '\', \'nao\')">';
                html += '<label for="' + questionId + '_no">Não</label>';
                html += '</div>';
                html += '</div>';
                html += '<input type="hidden" id="' + questionId + '" value="">';
                html += '</div>';
                return html;
            } else if (question.tipo === 'nps') {
                let html = '<div class="question-group">';
                html += '<label class="question-label">' + question.texto + '</label>';
                html += '<div class="nps-buttons">';
                for (let i = 0; i <= 10; i++) {
                    html += '<button type="button" class="nps-btn" onclick="selectNps(\'' + questionId + '\', ' + i + ')">' + i + '</button>';
                }
                html += '</div>';
                html += '<input type="hidden" id="' + questionId + '" value="">';
                html += '</div>';
                return html;
            } else if (question.tipo === 'texto') {
                let html = '<div class="question-group">';
                html += '<label class="question-label">' + question.texto + '</label>';
                html += '<textarea class="textárea-input" id="' + questionId + '" placeholder="Suas respostas aqui..."></textarea>';
                html += '</div>';
                return html;
            }

            if (question.tipo === 'radio' && question.opcoes) {
                let html = '<div class="question-group">';
                html += '<label class="question-label">' + question.texto + '</label>';
                html += '<div class="radio-group">';
                question.opcoes.forEach(function(opcao, i) {
                    html += '<div class="radio-item">';
                    html += '<input type="radio" id="' + questionId + '_' + i + '" name="' + questionId + '" value="' + opcao + '" onchange="selectOption(\'' + questionId + '\', \'' + opcao.replace(/'/g, "\\'") + '\')">';
                    html += '<label for="' + questionId + '_' + i + '">' + opcao + '</label>';
                    html += '</div>';
                });
                html += '</div>';
                html += '<input type="hidden" id="' + questionId + '" value="">';
                html += '</div>';
                return html;
            }

            return '';
        }

        async function saveEvaluation(tipo, fichaId) {
            var template = SURVEY_TEMPLATES[tipo];
            var respostas = {};

            template.secoes.forEach(function(secao) {
                secao.questoes.forEach(function(questao) {
                    var inputId = tipo + '_' + questao.id;
                    var input = document.getElementById(inputId);
                    if (input) {
                        respostas[questao.id] = input.value;
                    }
                });
            });

            try {
                await db.collection('pesquisas').add({
                    avaliador_id: currentUser.id,
                    avaliador_nome: currentUser.nome,
                    colaborador_id: fichaId,
                    tipo_pesquisa: tipo,
                    respostas: respostas,
                    data_avaliacao: new Date()
                });
                invalidateCache('pesquisas:');

                // Marcar liberação como respondida
                try {
                    var libs = await db.collection('liberacoes')
                        .where('colaborador_id', '==', fichaId)
                        .where('tipo_pesquisa', '==', tipo)
                        .get();
                    const libsList = [];
                    libs.forEach(doc => libsList.push({ id: doc.id, ...doc.data() }));
                    libsList.sort((a, b) => {
                        const da = toDate(a.data_liberacao);
                        const db2 = toDate(b.data_liberacao);
                        return db2 - da;
                    });
                    for (const lib of libsList) {
                        if (!lib.respondida) {
                            await db.collection('liberacoes').doc(lib.id).update({
                                respondida: true,
                                data_resposta: new Date()
                            });
                            break;
                        }
                    }
                    invalidateCache('liberacoes:');
                } catch(_) {}

                showToast('success', 'Salvo!', 'Pesquisa salva com sucesso.');
                closeModal();
                loadLiberacoes();
            } catch (error) {
                console.error('Erro ao salvar pesquisa:', error);
                showToast('error', 'Erro ao salvar', error.message);
            }
        }

        async function loadDashboard() {
            var statsContainer = document.getElementById('dashboardStats');
            var contentContainer = document.getElementById('dashboardContent');
            statsContainer.innerHTML = '<div class="loading"></div>';
            contentContainer.innerHTML = '';
            destroyCharts();

            try {
                var [usuarios, pesquisas, fichasSnap, promoSnap, liberacoes, respostas] = await Promise.all([
                    cachedGet('usuarios:all', function() { return db.collection('usuarios').get(); }),
                    cachedGet('pesquisas:all', function() { return db.collection('pesquisas').get(); }),
                    cachedGet('fichas:all', function() { return db.collection('fichas').get(); }),
                    cachedGet('avaliacoes_promocao:all', function() { return db.collection('avaliacoes_promocao').get(); }),
                    cachedGet('liberacoes:all', function() { return db.collection('liberacoes').get(); }),
                    cachedGet('respostas:all', function() { return db.collection('respostas').get(); })
                ]);

                // ── KPI Data ──
                var totalUsers = usuarios.size;
                var activeUsers = 0;
                var perfisCount = {};
                usuarios.forEach(function(doc) {
                    var u = doc.data();
                    if (u.ativo !== false) activeUsers++;
                    var perfil = u.perfil || 'sem perfil';
                    perfisCount[perfil] = (perfisCount[perfil] || 0) + 1;
                });

                var totalSurveys = pesquisas.size + respostas.size;
                var totalLiberacoes = liberacoes.size;
                var libRespondidas = 0;
                var libPendentes = 0;
                liberacoes.forEach(function(doc) {
                    var l = doc.data();
                    if (l.respondida) libRespondidas++;
                    else libPendentes++;
                });

                var totalFichas = fichasSnap.size;
                var totalPromo = promoSnap.size;
                var totalRegistrosPromo = 0;
                promoSnap.forEach(function(doc) {
                    var d = doc.data();
                    totalRegistrosPromo += (d.registros || []).length;
                });

                // Pesquisas por mês (últimos 6 meses)
                var pesquisasPorMes = {};
                var now = new Date();
                for (var m = 5; m >= 0; m--) {
                    var d = new Date(now.getFullYear(), now.getMonth() - m, 1);
                    var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                    pesquisasPorMes[key] = 0;
                }
                // Combinar pesquisas + respostas para contagem por mês
                function countByMonth(snapshot) {
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        var dt = toDate(data.data_avaliacao || data.data_resposta);
                        var key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
                        if (pesquisasPorMes.hasOwnProperty(key)) pesquisasPorMes[key]++;
                    });
                }
                countByMonth(pesquisas);
                countByMonth(respostas);

                // Liberações por tipo
                var libPorTipo = {};
                var resPorTipo = {};
                liberacoes.forEach(function(doc) {
                    var l = doc.data();
                    var t = l.tipo_pesquisa || 'outro';
                    libPorTipo[t] = (libPorTipo[t] || 0) + 1;
