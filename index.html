        async function loadLiberacoes() {
            var container = document.getElementById('liberacoesContainer');
            container.innerHTML = '<div class="loading"></div>';

            try {
                var [fichasSnap, liberacoes, respostas] = await Promise.all([
                    cachedGet('fichas:all', function() { return db.collection('fichas').get(); }),
                    cachedGet('liberacoes:all', function() { return db.collection('liberacoes').get(); }),
                    cachedGet('respostas:all', function() { return db.collection('respostas').get(); })
                ]);

                // Agrupar liberações por ficha
                var liberacoesPorFicha = {};
                liberacoes.forEach(function(doc) {
                    var data = doc.data();
                    if (!liberacoesPorFicha[data.colaborador_id]) liberacoesPorFicha[data.colaborador_id] = [];
                    liberacoesPorFicha[data.colaborador_id].push({ id: doc.id, ...data });
                });

                // Ordenar liberações de cada ficha por data
                for (var fid in liberacoesPorFicha) {
                    liberacoesPorFicha[fid].sort(function(a, b) {
                        return toDate(b.data_liberacao) - toDate(a.data_liberacao);
                    });
                }

                // Filter fichas by team for gestor/analista
                var fichasList = [];
                fichasSnap.forEach(function(doc) {
                    var f = doc.data();
                    if (currentUser.perfil === 'admin') {
                        fichasList.push({ id: doc.id, ...f });
                    } else if (f.gestor_responsavel_id === currentUser.id) {
                        fichasList.push({ id: doc.id, ...f });
                    }
                });

                var html = '';

                fichasList.forEach(function(f) {
                    var uid = f.id;
                    var libs = liberacoesPorFicha[uid] || [];
                    var totalEnviadas = libs.length;
                    var totalRespondidas = 0;
                    libs.forEach(function(l) {
                        if (l.respondida) totalRespondidas++;
                    });
                    var totalPendentes = totalEnviadas - totalRespondidas;

                    // Card por colaborador
                    html += '<div class="card" style="margin-bottom:12px;">';

                    // Header clicável
                    html += '<div class="card-header" style="cursor:pointer;" onclick="toggleLibPanel(\'' + uid + '\')">';
                    html += '<div style="display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap;">';
                    html += '<strong style="font-size:15px;">' + f.nome + '</strong>';
                    if (f.cargo) html += '<span class="badge badge-primary">' + f.cargo + '</span>';
                    if (f.departamento) html += '<span style="color:#636E72;font-size:13px;">' + f.departamento + '</span>';
                    html += '</div>';
                    html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
                    if (totalEnviadas > 0) {
                        html += '<span style="font-size:12px;background:#e8f5e9;color:#2e7d32;padding:3px 8px;border-radius:12px;">' + totalRespondidas + ' respondida' + (totalRespondidas !== 1 ? 's' : '') + '</span>';
                        if (totalPendentes > 0) html += '<span style="font-size:12px;background:#fff3e0;color:#e65100;padding:3px 8px;border-radius:12px;">' + totalPendentes + ' pendente' + (totalPendentes !== 1 ? 's' : '') + '</span>';
                    } else {
                        html += '<span style="font-size:12px;color:#636E72;">Nenhum envio</span>';
                    }
                    html += '<button class="btn btn-primary btn-small" onclick="event.stopPropagation();openLiberacaoForm(\'' + uid + '\', \'' + (f.nome || '').replace(/'/g, "\\'") + '\')">+ Enviar</button>';
                    html += '<span id="libArrow_' + uid + '" style="font-size:18px;transition:transform 0.2s;">▸</span>';
                    html += '</div>';
                    html += '</div>';

                    // Painel expansível (oculto por padrão)
                    html += '<div id="libPanel_' + uid + '" style="display:none;padding:0 15px 15px;">';

                    if (libs.length === 0) {
                        html += '<p style="color:#636E72;margin:10px 0;">Nenhuma pesquisa enviada para este colaborador.</p>';
                    } else {
                        html += '<table class="table" style="font-size:13px;margin-top:10px;">';
                        html += '<thead><tr><th>Pesquisa</th><th>Data Envio</th><th>Enviado Por</th><th>Status</th><th>Ações</th></tr></thead>';
                        html += '<tbody>';
                        libs.forEach(l => {
                            const nomeP = SURVEY_TEMPLATES[l.tipo_pesquisa] ? SURVEY_TEMPLATES[l.tipo_pesquisa].nome : l.tipo_pesquisa;
                            const dataLib = formatDate(l.data_liberacao);
                            const foiRespondida = l.respondida;
                            const statusHtml = foiRespondida
                                ? '<span style="color:#2e7d32;font-weight:600;">✅ Respondida' + (l.data_resposta ? ' em ' + formatDate(l.data_resposta) : '') + '</span>'
                                : '<span style="color:#e65100;font-weight:600;">⏳ Pendente</span>';
                            const enviadoPor = l.liberado_por_nome || l.liberado_por || 'N/A';

                            html += '<tr>';
                            html += '<td>' + nomeP + '</td>';
                            html += '<td>' + dataLib + '</td>';
                            html += '<td>' + enviadoPor + '</td>';
                            html += '<td>' + statusHtml + '</td>';
                            html += '<td><button class="btn btn-danger btn-small" onclick="excluirLiberacao(\'' + l.id + '\')">Excluir</button></td>';
                            html += '</tr>';
                        });
                        html += '</tbody></table>';
                    }

                    html += '</div>'; // fecha painel
                    html += '</div>'; // fecha card
                });

                container.innerHTML = html;
            } catch (error) {
                console.error('Erro ao carregar liberações:', error);
                container.innerHTML = '<div class="alert alert-error">Erro ao carregar liberações</div>';
            }
        }

        function toggleLibPanel(uid) {
            const panel = document.getElementById('libPanel_' + uid);
            const arrow = document.getElementById('libArrow_' + uid);
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                arrow.style.transform = 'rotate(90deg)';
            } else {
                panel.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        async function excluirLiberacao(libId) {
            showConfirm('🗑️', 'Excluir liberação', 'Tem certeza que deseja excluir esta liberação? Esta ação não pode ser desfeita.', 'Excluir', async function() {
                try {
                    await db.collection('liberacoes').doc(libId).delete();
                    invalidateCache('liberacoes:');
                    showToast('success', 'Excluída', 'Liberação removida com sucesso.');

                } catch(error) {
                    console.error('Erro ao excluir liberação:', error);
                    showToast('error', 'Erro', error.message);
                }
            });
        }

        async function openLiberacaoForm(userId, userName) {
            // Buscar histórico de liberações para este usuário
            const existentes = await db.collection('liberacoes')
                .where('colaborador_id', '==', userId)
                .get();

            let historicoHtml = '';
            const liberacoesList = [];
            existentes.forEach(doc => {
                const l = doc.data();
                liberacoesList.push({ id: doc.id, ...l });
            });

            if (liberacoesList.length > 0) {
                historicoHtml = '<div style="margin-bottom:15px;"><strong>Histórico de liberações:</strong></div>';
                historicoHtml += '<div class="table-wrapper"><table class="table" style="font-size:13px;"><thead><tr><th>Pesquisa</th><th>Data</th><th>Status</th><th>Ação</th></tr></thead><tbody>';
                liberacoesList.sort((a, b) => {
                    const da = toDate(a.data_liberacao);
                    const db2 = toDate(b.data_liberacao);
                    return db2 - da;
                });
                liberacoesList.forEach(l => {
                    const nomeP = SURVEY_TEMPLATES[l.tipo_pesquisa] ? SURVEY_TEMPLATES[l.tipo_pesquisa].nome : l.tipo_pesquisa;
                    const dataLib = formatDate(l.data_liberacao);
                    const statusLib = l.respondida ? '<span style="color:green;">Respondida</span>' : '<span style="color:orange;">Pendente</span>';
                    historicoHtml += '<tr><td>' + nomeP + '</td><td>' + dataLib + '</td><td>' + statusLib + '</td>';
                    historicoHtml += '<td><button class="btn btn-danger btn-small" onclick="removeLiberacao(\'' + l.id + '\',\'' + userId + '\',\'' + userName.replace(/'/g, "\\'") + '\')">Remover</button></td></tr>';
                });
                historicoHtml += '</tbody></table></div><hr style="margin:15px 0;">';
            }

            const html = historicoHtml +
                '<div class="pdi-form-section">' +
                '<label><strong>Enviar nova pesquisa:</strong></label>' +
                '<select id="libTipoPesquisa" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;margin-top:5px;">' +
                '<option value="">-- Selecione o tipo --</option>' +
                '<option value="experiencia_45_etapa1">Experiência 45 dias - Etapa 1 (RH)</option>' +
                '<option value="experiencia_45_etapa2">Experiência 45 dias - Etapa 2 (Gestor)</option>' +
                '</select>' +
                '</div>';

            openModal('Liberar Pesquisas para ' + userName, html, [
                { text: 'Fechar', onclick: 'closeModal()', class: 'btn-secondary' },
                { text: 'Enviar Pesquisa', onclick: 'enviarNovaLiberacao("' + userId + '","' + userName.replace(/"/g, '\\"') + '")', class: 'btn-primary' }
            ]);
        }

        async function enviarNovaLiberacao(userId, userName) {
            const tipo = document.getElementById('libTipoPesquisa').value;
            if (!tipo) { showToast('warn', 'Atenção', 'Selecione um tipo de pesquisa.'); return; }

            try {
                await db.collection('liberacoes').add({
                    colaborador_id: userId,
                    tipo_pesquisa: tipo,
                    liberado_por: currentUser.email,
                    liberado_por_nome: currentUser.nome,
                    data_liberacao: new Date(),
                    respondida: false
                });
                invalidateCache('liberacoes:');
                showToast('success', 'Liberada!', 'Pesquisa liberada para ' + userName);
                closeModal();
                openLiberacaoForm(userId, userName);
            } catch (error) {
                console.error('Erro ao liberar pesquisa:', error);
                showToast('error', 'Erro ao liberar', error.message);
            }
        }

            showConfirm('🗑️', 'Remover liberação', 'Tem certeza que deseja remover esta liberação?', 'Remover', async function() {
                try {
                    await db.collection('liberacoes').doc(libId).delete();
                    invalidateCache('liberacoes:');
                    closeModal();
                    openLiberacaoForm(userId, userName);
                } catch(error) {
                    console.error('Erro ao remover liberação:', error);
                    showToast('error', 'Erro', error.message);
                }
            });
        }

        async function loadPesquisas() {
            var container = document.getElementById('pesquisasContainer');
            container.innerHTML = '<div class="loading"></div>';

            try {
                var [respostasSnap, pesquisasSnap, usuariosSnap] = await Promise.all([
                    cachedGet('respostas:all', function() { return db.collection('respostas').get(); }),
                    cachedGet('pesquisas:all', function() { return db.collection('pesquisas').get(); }),
                    cachedGet('usuarios:all', function() { return db.collection('usuarios').get(); })
                ]);

                // Mapa de IDs para nomes
                var nomeMap = {};
                usuariosSnap.forEach(function(doc) { nomeMap[doc.id] = doc.data().nome || doc.data().email; });

                // Combinar todas as respostas
                var todas = [];
                respostasSnap.forEach(function(doc) {
                    var r = doc.data();
                    todas.push({
                        id: doc.id,
                        collection: 'respostas',
                        respondente: r.usuario_nome || nomeMap[r.usuario_id] || 'Colaborador',
                        colaborador: nomeMap[r.colaborador_id] || r.usuario_nome || 'N/A',
                        tipo: r.tipo_pesquisa,
                        data: toDate(r.data_resposta),
                        respostas: r.respostas
                    });
                });
                pesquisasSnap.forEach(function(doc) {
                    var p = doc.data();
                    todas.push({
                        id: doc.id,
                        collection: 'pesquisas',
                        respondente: p.avaliador_nome || 'Avaliador',
                        colaborador: nomeMap[p.colaborador_id] || p.colaborador_id || 'N/A',
                        tipo: p.tipo_pesquisa,
                        data: toDate(p.data_avaliacao || p.data_resposta),
                        respostas: p.respostas
                    });
                });

                todas.sort(function(a, b) { return b.data - a.data; });

                var html = '';
                if (todas.length === 0) {
                    html = '<div class="alert alert-info">Nenhuma pesquisa respondida ainda.</div>';
                } else {
                    html += '<p style="color:#636E72;font-size:13px;margin-bottom:12px;">Total: <strong>' + todas.length + '</strong> resposta(s)</p>';
                    html += '<div class="table-wrapper"><table class="table">';
                    html += '<thead><tr><th>Respondente</th><th>Colaborador Avaliado</th><th>Tipo</th><th>Data</th><th>Ação</th></tr></thead>';
                    html += '<tbody>';

                    todas.forEach(function(r) {
                        var tipoLabel = PESQUISA_LABELS[r.tipo] || r.tipo || 'N/A';
                        html += '<tr>';
                        html += '<td>' + r.respondente + '</td>';
                        html += '<td>' + r.colaborador + '</td>';
                        html += '<td style="font-size:12px;">' + tipoLabel + '</td>';
                        html += '<td>' + formatDate(r.data) + '</td>';
                        html += '<td><button class="btn btn-secondary" style="font-size:11px;padding:5px 10px;" onclick="verRespostaDetalhe(\'' + r.id + '\', \'' + r.collection + '\')">👁 Ver</button></td>';
                        html += '</tr>';
                    });

                    html += '</tbody></table></div>';
                }

                container.innerHTML = html;
            } catch (error) {
                console.error('Erro ao carregar pesquisas:', error);
                container.innerHTML = '<div class="alert alert-error">Erro ao carregar pesquisas</div>';
            }
        }

        async function verRespostaDetalhe(docId, collectionName) {
            try {
                var doc = await db.collection(collectionName).doc(docId).get();
                var data = doc.data();
                var respostas = data.respostas || {};
                var tipo = data.tipo_pesquisa;
                var template = SURVEY_TEMPLATES[tipo];
                var respondente = data.avaliador_nome || data.usuario_nome || 'Colaborador';

                var html = '<p style="color:#636E72;font-size:13px;margin-bottom:16px;">Respondido por: <strong>' + respondente + '</strong> em ' + formatDate(data.data_avaliacao || data.data_resposta) + '</p>';

                if (template) {
                    template.secoes.forEach(function(secao) {
                        html += '<div style="margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #eee;">';
                        html += '<h4 style="color:var(--primary);margin-bottom:10px;">' + secao.titulo + '</h4>';
                        secao.questoes.forEach(function(q) {
                            var resp = respostas[q.id] || 'Não respondido';

        async function handleXlsxUpload(event) {
            var file = event.target.files[0];
            if (!file) return;
            event.target.value = '';

            try {
                var data = await file.arrayBuffer();
                var wb = XLSX.read(data, { type: 'array' });
                var ws = wb.Sheets[wb.SheetNames[0]];
                var rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

                if (rows.length === 0) {
                    showToast('error', 'Planilha vazia', 'Nenhuma linha de dados encontrada.');
                    return;
                }

                // Normalizar cabeçalhos
                var normalized = rows.map(function(r) {
                    var obj = {};
                    Object.keys(r).forEach(function(k) {
                        obj[k.trim().toLowerCase()] = ('' + r[k]).trim();
                    });
                    return obj;
                });

                // Verificar colunas obrigatórias
                var first = Object.keys(normalized[0]);
                var required = ['nome', 'email', 'perfil', 'gestor'];
                var missing = required.filter(function(c) { return first.indexOf(c) === -1; });
                if (missing.length > 0) {
                    showToast('error', 'Colunas faltando', 'A planilha precisa ter: ' + missing.join(', '));
                    return;
                }

                // Buscar gestores existentes para validar
                var usuarios = await cachedGet('usuarios:all', function() { return db.collection('usuarios').get(); });
                importGestorMap = {};
                usuarios.forEach(function(doc) {
                    var u = doc.data();
                    if (u.perfil === 'gestor' || u.perfil === 'admin' || u.perfil === 'analista' || u.perfil === 'diretoria') {
                        importGestorMap[u.nome.toLowerCase().trim()] = { id: doc.id, nome: u.nome };
                    }
                });

                // Buscar emails existentes
                var existingEmails = {};
                usuarios.forEach(function(doc) {
                    var u = doc.data();
                    if (u.email) existingEmails[u.email.toLowerCase().trim()] = true;
                });

                // Validar cada linha
                var perfisValidos = ['colaborador', 'gestor', 'analista', 'diretoria', 'admin'];
                importParsedRows = normalized.map(function(r, idx) {
                    var errors = [];
                    if (!r.nome) errors.push('Nome vazio');
                    if (!r.email) errors.push('Email vazio');
                    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) errors.push('Email inválido');
                    else if (existingEmails[r.email.toLowerCase()]) errors.push('Email já cadastrado');
                    if (!r.perfil) errors.push('Perfil vazio');
                    else if (perfisValidos.indexOf(r.perfil.toLowerCase()) === -1) errors.push('Perfil inválido');
                    var gestorMatch = null;
                    if (r.gestor) {
                        gestorMatch = importGestorMap[r.gestor.toLowerCase().trim()] || null;
                        if (!gestorMatch) errors.push('Gestor não encontrado');
                    }
                    return {
                        nome: r.nome,
                        email: r.email,
                        perfil: r.perfil ? r.perfil.toLowerCase() : '',
                        gestor: r.gestor,
                        gestorMatch: gestorMatch,
                        cargo: r.cargo || '',
                        setor: r.setor || '',
                        errors: errors,
                        row: idx + 2
                    };
                });

                showImportPreview();
            } catch(e) {
                console.error('Erro ao ler planilha:', e);
                showToast('error', 'Erro na leitura', 'Não foi possível ler o arquivo. Verifique se é um .xlsx válido.');
            }
        }

        function showImportPreview() {
            var valid = importParsedRows.filter(function(r) { return r.errors.length === 0; });
            var invalid = importParsedRows.filter(function(r) { return r.errors.length > 0; });

            var html = '<div class="import-stats">';
            html += '<span class="import-stat import-stat-total">📋 Total: ' + importParsedRows.length + '</span>';
            html += '<span class="import-stat import-stat-ok">✓ Válidos: ' + valid.length + '</span>';

            importParsedRows.forEach(function(r) {
                var cls = r.errors.length > 0 ? ' class="row-error"' : '';
                html += '<tr' + cls + '>';

                html += '<td>' + (r.errors.length === 0 ? '<span class="cell-ok">✓ OK</span>' : '<span class="cell-error">' + r.errors.join(', ') + '</span>') + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';

            html += '<div class="import-progress" id="importProgressArea" style="display:none;">';

            html += '<div class="import-progress-text" id="importProgressText">Preparando...</div>';

            }

            var buttons = [
                { text: 'Cancelar', onclick: 'closeModal()', class: 'btn-secondary' }
            ];
            if (valid.length > 0) {
                buttons.push({ text: 'Importar ' + valid.length + ' usuários', onclick: 'executarImportacao()', class: 'btn-primary' });
            }
            openModal('📊 Preview da Importação — ' + importParsedRows.length + ' linhas', html, buttons);

        async function executarImportacao() {
            var valid = importParsedRows.filter(function(r) { return r.errors.length === 0; });
            if (valid.length === 0) { showToast('warn', 'Nada para importar', 'Nenhuma linha válida.'); return; }

            // Disable buttons
            var modalBtns = document.querySelectorAll('.modal-footer button');
            modalBtns.forEach(function(b) { b.disabled = true; });

            var progressArea = document.getElementById('importProgressArea');
            var progressFill = document.getElementById('importProgressFill');
            var progressText = document.getElementById('importProgressText');
            if (progressArea) progressArea.style.display = 'block';

            var success = 0;
            var failed = 0;

            for (var i = 0; i < valid.length; i++) {
                var r = valid[i];
                var pct = Math.round(((i + 1) / valid.length) * 100);
                if (progressFill) progressFill.style.width = pct + '%';
                if (progressText) progressText.textContent = 'Cadastrando ' + (i + 1) + ' de ' + valid.length + '... (' + r.nome + ')';

                try {
                    var password = generatePassword();
                    await db.collection('usuarios').add({
                        nome: r.nome,
                        email: r.email,
                        senha: hashSenha(password),
                        perfil: r.perfil,
                        gestor_id: r.gestorMatch ? r.gestorMatch.id : null,
                        lider: r.gestorMatch ? r.gestorMatch.nome : null,
                        cargo: r.cargo,
                        setor: r.setor,
                        ativo: true,
                        provisoria: true,
                        data_criacao: new Date()
                    });

                    // Envia email (sem bloquear se falhar)
                    try {
                        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                            to_email: r.email,
                            to_name: r.nome,
                            subject: 'Zukkin RH - Sua conta foi criada',
                            nova_senha: password
                        });
                    } catch(_) {}

                    success++;
                } catch(e) {
                    console.error('Erro ao importar ' + r.nome + ':', e);
                    failed++;
                }
            }

            invalidateCache('usuarios:');

            if (progressText) progressText.textContent = 'Concluído!';

            setTimeout(function() {
                closeModal();
                if (failed === 0) {
                    showToast('success', 'Importação concluída!', success + ' usuários cadastrados com sucesso. Senhas provisórias enviadas por email.');
                } else {
                    showToast('warn', 'Importação parcial', success + ' cadastrados com sucesso, ' + failed + ' falharam.');
                }
                loadUsuarios();
            }, 800);
        }

        function fichaTempoEmpresa(dataAdm) {
            if (!dataAdm) return '';
            var d = dataAdm.toDate ? dataAdm.toDate() : new Date(dataAdm);
            var now = new Date();
            var diffMs = now - d;
            var days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            if (days < 30) return days + ' dias';
            var months = Math.floor(days / 30);
            if (months < 12) return months + (months === 1 ? ' mês' : ' meses');
            var years = Math.floor(months / 12);
            var remMonths = months % 12;
            return years + (years === 1 ? ' ano' : ' anos') + (remMonths > 0 ? ' e ' + remMonths + 'm' : '');
        }

        function fichaInitials(nome) {
            return (nome || '?').split(' ').map(function(w) { return w[0]; }).join('').substring(0, 2).toUpperCase();

                    if (currentUser.perfil === 'admin' || currentUser.perfil === 'diretoria') {
                        fichasList.push({ id: doc.id, ...f });
                    } else if (f.gestor_responsavel_id === currentUser.id) {

                    }

                    html += '<button class="btn btn-primary" onclick="openFichaForm()">+ Nova Ficha</button>';

                        html += '</div>';
                        html += '</div>';
                        html += '<div class="ficha-badges">';
                        if (f.departamento) html += '<span class="evo-badge evo-badge-depto">' + f.departamento + '</span>';
                        if (tempo) html += '<span class="evo-badge evo-badge-tempo">⏱ ' + tempo + '</span>';
                        html += '</div>';
                        html += '<div class="ficha-actions">';
                        html += '<button class="btn btn-secondary btn-small" onclick="viewFicha(\'' + f.id + '\')">Ver Ficha</button>';
                        html += '<button class="btn btn-secondary btn-small" onclick="gerarRelatorio(\'' + f.id + '\')" style="font-size:11px;">🖨 Relatório</button>';
                        if (currentUser.perfil === 'admin' || currentUser.perfil === 'gestor' || currentUser.perfil === 'analista') {
                            html += '<button class="btn btn-primary btn-small" onclick="editFicha(\'' + f.id + '\')">Editar</button>';
                        }
                        if (currentUser.perfil === 'admin') {
                            html += '<button class="btn btn-danger btn-small" onclick="deleteFicha(\'' + f.id + '\')">Excluir</button>';
                        }
                        html += '</div>';
                        html += '</div>';
                    });
                    html += '</div>';
                }

                container.innerHTML = html;
            } catch (error) {
                console.error('Erro ao carregar fichas:', error);
                container.innerHTML = '<div class="alert alert-error">Erro ao carregar fichas</div>';
            }
        }

        function filterFichas() {
            var term = (document.getElementById('fichaSearchInput').value || '').toLowerCase();
            var cards = document.querySelectorAll('#fichaGrid .ficha-card');
            cards.forEach(function(card) {
                card.style.display = card.getAttribute('data-nome').indexOf(term) >= 0 ? '' : 'none';
            });
        }

        async function openFichaForm(docId) {

                } catch(e) {}

            // Build gestor select from usuarios

            var gestorOptions = '<option value="">-- Sem gestor --</option>';
            usuarios.forEach(function(doc) {
                var u = doc.data();
                if (u.perfil === 'gestor' || u.perfil === 'analista' || u.perfil === 'admin') {

                    gestorOptions += '<option value="' + doc.id + '" data-nome="' + (u.nome || '').replace(/"/g, '&quot;') + '" ' + sel + '>' + u.nome + ' (' + u.perfil + ')</option>';

        async function saveFicha(docId) {
            var nome = document.getElementById('fichaNome').value.trim();
            if (!nome) { showToast('warn', 'Atenção', 'Informe o nome do colaborador.'); return; }

            var gestorSelect = document.getElementById('fichaGestor');
            var gestorId = gestorSelect.value || null;
            var gestorNome = gestorSelect.selectedOptions[0] ? gestorSelect.selectedOptions[0].getAttribute('data-nome') || null : null;

            var admVal = document.getElementById('fichaAdmissao').value;
            var nascVal = document.getElementById('fichaNascimento').value;

            var data = {
                nome: nome,
                cpf: document.getElementById('fichaCpf').value.trim(),
                cargo: document.getElementById('fichaCargo').value.trim(),
                departamento: document.getElementById('fichaDepto').value,
                data_admissao: admVal ? new Date(admVal + 'T12:00:00') : null,
                data_nascimento: nascVal ? new Date(nascVal + 'T12:00:00') : null,
                telefone: document.getElementById('fichaTelefone').value.trim(),
                email_pessoal: document.getElementById('fichaEmail').value.trim(),
                endereco: document.getElementById('fichaEndereco').value.trim(),
                gestor_responsavel_id: gestorId,
                gestor_responsavel_nome: gestorNome,
                foto_url: document.getElementById('fichaFoto').value.trim(),
                ultima_atualizacao: new Date()
            };

            try {
                if (docId) {
                    await db.collection('fichas').doc(docId).update(data);
                } else {
                    data.data_criacao = new Date();
                    data.criado_por = currentUser.id;
                    await db.collection('fichas').add(data);
                }
                invalidateCache('fichas:');
                showToast('success', docId ? 'Ficha atualizada!' : 'Ficha criada!', '');
                closeModal();
                loadFichas();
            } catch (error) {
                console.error('Erro ao salvar ficha:', error);
                showToast('error', 'Erro ao salvar', error.message);
            }
        }

            showConfirm('⚠️', 'Excluir Ficha', 'Tem certeza que deseja excluir esta ficha? Esta ação é irreversível.', 'Excluir', async function() {
                try {

                    showToast('success', 'Ficha excluída', 'Ficha removida com sucesso.');
                    loadFichas();
                } catch (error) {
                    console.error('Erro ao excluir ficha:', error);
                    showToast('error', 'Erro', error.message);
                }
            });
        }

                // Sort by date desc
                var sorted = registros.slice().sort(function(a, b) {
                    var da = a.data ? (a.data.toDate ? a.data.toDate() : new Date(a.data)) : new Date(0);
                    var db2 = b.data ? (b.data.toDate ? b.data.toDate() : new Date(b.data)) : new Date(0);

            html += '<div class="form-section"><label>Descrição: *</label>';
            html += '<textarea id="promoTexto" placeholder="Descreva o registro..."></textarea></div>';

            html += '<div class="form-section"><label>Data:</label>';
            html += '<input type="date" id="promoData" value="' + new Date().toISOString().split('T')[0] + '"></div>';

            openModal('Novo Registro de Avaliação', html, [
                { text: 'Cancelar', onclick: 'closeModal()', class: 'btn-secondary' },
                { text: 'Salvar', onclick: 'saveRegistroPromocao(' + (promoDocId ? '"' + promoDocId + '"' : '') + ')', class: 'btn-primary' }
            ]);

        async function saveRegistroPromocao(promoDocId) {
            var fichaSelect = document.getElementById('promoFichaSelect');
            var fichaId = fichaSelect.value || fichaSelect.getAttribute('value');
            var fichaName = '';
            if (fichaSelect.tagName === 'SELECT' && fichaSelect.selectedOptions[0]) {
                fichaName = fichaSelect.selectedOptions[0].getAttribute('data-nome') || '';
            } else {
                fichaName = fichaSelect.getAttribute('data-nome') || '';
            }

            if (!fichaId) { showToast('warn', 'Atenção', 'Selecione um colaborador.'); return; }

            var tipo = document.getElementById('promoTipo').value;
            if (!tipo) { showToast('warn', 'Atenção', 'Selecione o tipo de registro.'); return; }

            var texto = document.getElementById('promoTexto').value.trim();
            if (!texto) { showToast('warn', 'Atenção', 'Informe a descrição.'); return; }

            var dataVal = document.getElementById('promoData').value;

            var registro = {
                tipo: tipo,
                texto: texto,
                autor: currentUser.nome,
                data: dataVal ? new Date(dataVal + 'T12:00:00') : new Date()
            };

            try {
                if (promoDocId) {
                    // Add to existing doc
                    var docSnap = await db.collection('avaliacoes_promocao').doc(promoDocId).get();
                    var data = docSnap.data();
                    var registros = data.registros || [];
                    registros.push(registro);
                    await db.collection('avaliacoes_promocao').doc(promoDocId).update({ registros: registros });
                } else {
                    // Check if doc exists for this ficha
                    var existing = await db.collection('avaliacoes_promocao').where('ficha_id', '==', fichaId).get();
                    if (!existing.empty) {
                        var existDoc = existing.docs[0];
                        var existData = existDoc.data();
                        var existRegs = existData.registros || [];
                        existRegs.push(registro);
                        await db.collection('avaliacoes_promocao').doc(existDoc.id).update({ registros: existRegs });
                    } else {
                        // Create new doc
                        await db.collection('avaliacoes_promocao').add({
                            ficha_id: fichaId,
                            colaborador_nome: fichaName,
                            registros: [registro],
                            criado_por: currentUser.id,
                            data_criacao: new Date()
                        });
                    }
                }

                invalidateCache('avaliacoes_promocao:');
                showToast('success', 'Registro adicionado!', '');
                closeModal();
                loadPromocao();
            } catch (error) {
                console.error('Erro ao salvar registro:', error);
                showToast('error', 'Erro', error.message);
            }
        }

        function deleteRegistro(docId, index) {
            showConfirm('⚠️', 'Remover Registro', 'Tem certeza que deseja remover este registro?', 'Remover', async function() {
                try {
                    var docSnap = await db.collection('avaliacoes_promocao').doc(docId).get();
                    var data = docSnap.data();
                    var registros = data.registros || [];
                    // Sort by date desc to match display order
                    var sorted = registros.map(function(r, i) { return { ...r, _origIdx: i }; });
                    sorted.sort(function(a, b) {
                        var da = a.data ? (a.data.toDate ? a.data.toDate() : new Date(a.data)) : new Date(0);
                        var db2 = b.data ? (b.data.toDate ? b.data.toDate() : new Date(b.data)) : new Date(0);
                        return db2 - da;
                    });
                    var origIdx = sorted[index]._origIdx;
                    registros.splice(origIdx, 1);
                    await db.collection('avaliacoes_promocao').doc(docId).update({ registros: registros });
                    invalidateCache('avaliacoes_promocao:');
                    showToast('success', 'Registro removido', '');
                    closeModal();
                    loadPromocao();
                } catch (error) {
                    console.error('Erro ao remover registro:', error);
                    showToast('error', 'Erro', error.message);
                }
            });
        }

        async function loadCompetencias() {

                var [compSnap, fichasSnap] = await Promise.all([

                    cachedGet('fichas:all', function() { return db.collection('fichas').get(); })
                ]);

                var fichaMap = {};
                fichasSnap.forEach(function(doc) { fichaMap[doc.id] = doc.data(); });

                var compList = [];
                compSnap.forEach(function(doc) {
                    var d = doc.data();
                    var ficha = fichaMap[d.ficha_id];
                    if (currentUser.perfil === 'admin' || currentUser.perfil === 'diretoria') {
                        compList.push({ id: doc.id, ...d });
                    } else if (ficha && ficha.gestor_responsavel_id === currentUser.id) {
                        compList.push({ id: doc.id, ...d });
                    }
                });

                var html = '<div class="ficha-search">';

                html += '</div>';

                if (compList.length === 0) {
                    html += '<div class="alert alert-info">Nenhuma avaliação por competências encontrada.</div>';
                } else {
                    html += '<div id="compList">';
                    compList.forEach(function(c) {
                        var criterios = c.criterios || {};
                        var gestor_scores = [], rh_scores = [];
                        CRITERIOS_COMPETENCIA.forEach(function(cr) {
                            var v = criterios[cr];
                            if (v) {
                                if (v.gestor) gestor_scores.push(v.gestor);
                                if (v.rh) rh_scores.push(v.rh);
                            }
                        });
                        var mediaGestor = gestor_scores.length > 0 ? (gestor_scores.reduce(function(a,b){return a+b;},0) / gestor_scores.length).toFixed(1) : '-';
                        var mediaRH = rh_scores.length > 0 ? (rh_scores.reduce(function(a,b){return a+b;},0) / rh_scores.length).toFixed(1) : '-';
                        var dt = c.data_atualizacao ? (c.data_atualizacao.toDate ? c.data_atualizacao.toDate() : new Date(c.data_atualizacao)) : null;

                        html += '<div class="promo-card" data-nome="' + (c.colaborador_nome || '').toLowerCase() + '">';

                        }
                        html += '</div></div>';
                        html += '<div class="comp-media" style="margin-top:8px;padding:10px;">';
                        html += '<div class="comp-media-item"><div class="comp-media-valor">' + mediaGestor + '</div><div class="comp-media-label">Média Gestor</div></div>';
                        html += '<div class="comp-media-item"><div class="comp-media-valor">' + mediaRH + '</div><div class="comp-media-label">Média RH</div></div>';
                        var mediaGeral = (gestor_scores.length > 0 && rh_scores.length > 0) ? ((parseFloat(mediaGestor) + parseFloat(mediaRH)) / 2).toFixed(1) : '-';
                        html += '<div class="comp-media-item"><div class="comp-media-valor">' + mediaGeral + '</div><div class="comp-media-label">Média Geral</div></div>';
                        html += '</div>';
                        if (dt) html += '<p style="font-size:11px;color:#999;margin-top:8px;">Última atualização: ' + formatDate(dt) + '</p>';
                        html += '</div>';
                    });
                    html += '</div>';
                }

                container.innerHTML = html;
            } catch (error) {
                console.error('Erro ao carregar competências:', error);
                container.innerHTML = '<div class="alert alert-error">Erro ao carregar avaliações por competências</div>';
            }
        }

        function filterCompetencias() {
            var term = (document.getElementById('compSearchInput').value || '').toLowerCase();
            var cards = document.querySelectorAll('#compList .promo-card');
            cards.forEach(function(card) {
                card.style.display = card.getAttribute('data-nome').indexOf(term) >= 0 ? '' : 'none';
            });
        }

        async function viewCompetencia(docId) {
            try {
                var docSnap = await db.collection('avaliacoes_competencias').doc(docId).get();
                if (!docSnap.exists) { showToast('error', 'Erro', 'Avaliação não encontrada.'); return; }
                var c = docSnap.data();
                var criterios = c.criterios || {};

                var html = '<h3 style="margin-bottom:16px;">' + (c.colaborador_nome || 'Colaborador') + '</h3>';

                html += '<table class="comp-table">';
                html += '<thead><tr><th style="width:35%;">Critério</th><th class="comp-score-cell">Gestor</th><th class="comp-score-cell">RH</th><th>Evidências</th></tr></thead>';
                html += '<tbody>';

                var gTotal = 0, gCount = 0, rTotal = 0, rCount = 0;
                CRITERIOS_COMPETENCIA.forEach(function(cr) {
                    var v = criterios[cr] || {};
                    var gScore = v.gestor || '';
                    var rScore = v.rh || '';
                    var evidencias = v.evidencias || '';
                    if (gScore) { gTotal += gScore; gCount++; }
                    if (rScore) { rTotal += rScore; rCount++; }

                    html += '<tr>';
                    html += '<td>' + cr + '</td>';
                    html += '<td class="comp-score-cell">' + (gScore ? '<span class="comp-score s' + gScore + '">' + gScore + '</span>' : '<span style="color:#ccc;">-</span>') + '</td>';
                    html += '<td class="comp-score-cell">' + (rScore ? '<span class="comp-score s' + rScore + '">' + rScore + '</span>' : '<span style="color:#ccc;">-</span>') + '</td>';
                    html += '<td class="comp-evidencia">' + (evidencias || '<span style="color:#ccc;">—</span>') + '</td>';
                    html += '</tr>';
                });
                html += '</tbody></table>';

                var mediaG = gCount > 0 ? (gTotal / gCount).toFixed(1) : '-';
                var mediaR = rCount > 0 ? (rTotal / rCount).toFixed(1) : '-';
                var mediaGeral = (gCount > 0 && rCount > 0) ? ((parseFloat(mediaG) + parseFloat(mediaR)) / 2).toFixed(1) : '-';

                html += '<div class="comp-media">';
                html += '<div class="comp-media-item"><div class="comp-media-valor">' + mediaG + '</div><div class="comp-media-label">Média Gestor</div></div>';
                html += '<div class="comp-media-item"><div class="comp-media-valor">' + mediaR + '</div><div class="comp-media-label">Média RH</div></div>';
                html += '<div class="comp-media-item"><div class="comp-media-valor">' + mediaGeral + '</div><div class="comp-media-label">Média Geral</div></div>';
                html += '</div>';

                html += '<div class="comp-legend">';
                html += '<span><span class="comp-legend-dot" style="background:#ffebee;"></span> 1 - Insuficiente</span>';
                html += '<span><span class="comp-legend-dot" style="background:#fff3e0;"></span> 2 - Abaixo</span>';
                html += '<span><span class="comp-legend-dot" style="background:#fff8e1;"></span> 3 - Regular</span>';
                html += '<span><span class="comp-legend-dot" style="background:#e8f5e9;"></span> 4 - Bom</span>';
                html += '<span><span class="comp-legend-dot" style="background:#e3f2fd;"></span> 5 - Excelente</span>';
                html += '</div>';

                openModal('Avaliação por Competências', html, [
                    { text: 'Fechar', onclick: 'closeModal()', class: 'btn-secondary' },
                    { text: 'Editar', onclick: 'closeModal();openCompetenciaForm(\'' + c.ficha_id + '\',\'' + (c.colaborador_nome || '').replace(/'/g, "\\'") + '\',\'' + docId + '\')', class: 'btn-primary' }
                ]);
            } catch (error) {
                console.error('Erro ao visualizar competência:', error);
                showToast('error', 'Erro', error.message);
            }
        }

        async function openCompetenciaForm(fichaId, colaboradorNome, compDocId) {
            var html = '';
            var existingCriterios = {};

            if (compDocId) {
                var docSnap = await db.collection('avaliacoes_competencias').doc(compDocId).get();
                if (docSnap.exists) existingCriterios = docSnap.data().criterios || {};
            }

            if (!fichaId) {
                var fichasSnap = await cachedGet('fichas:all', function() { return db.collection('fichas').get(); });
                html += '<div class="form-section"><label>Colaborador: *</label>';
                html += '<select id="compFichaSelect"><option value="">-- Selecione --</option>';
                fichasSnap.forEach(function(doc) {
                    var f = doc.data();
                    if (currentUser.perfil === 'admin' || f.gestor_responsavel_id === currentUser.id) {
                        html += '<option value="' + doc.id + '" data-nome="' + (f.nome || '').replace(/"/g, '&quot;') + '">' + f.nome + ' (' + (f.cargo || '') + ')</option>';
                    }
                });
                html += '</select></div>';
            } else {
                html += '<p style="margin-bottom:12px;font-size:13px;color:#636E72;">Colaborador: <strong>' + (colaboradorNome || '') + '</strong></p>';
                html += '<input type="hidden" id="compFichaSelect" value="' + fichaId + '" data-nome="' + (colaboradorNome || '').replace(/"/g, '&quot;') + '">';
            }

            var isAdmin = currentUser.perfil === 'admin';
            var isGestor = currentUser.perfil === 'gestor' || currentUser.perfil === 'analista';

            html += '<div style="overflow-x:auto;">';
            html += '<table class="comp-table">';
            html += '<thead><tr><th style="width:35%;">Critério</th><th class="comp-score-cell">Gestor (1-5)</th><th class="comp-score-cell">RH (1-5)</th><th>Evidências</th></tr></thead>';
            html += '<tbody>';

            CRITERIOS_COMPETENCIA.forEach(function(cr, idx) {
                var v = existingCriterios[cr] || {};
                html += '<tr>';
                html += '<td style="font-size:12px;">' + cr + '</td>';
                html += '<td class="comp-score-cell"><input type="number" class="comp-score-input" id="comp_g_' + idx + '" min="1" max="5" value="' + (v.gestor || '') + '" ' + (isAdmin && !isGestor ? 'readonly style="opacity:0.6;"' : '') + '></td>';
                html += '<td class="comp-score-cell"><input type="number" class="comp-score-input" id="comp_r_' + idx + '" min="1" max="5" value="' + (v.rh || '') + '" ' + (!isAdmin ? 'readonly style="opacity:0.6;"' : '') + '></td>';
                html += '<td><textarea class="comp-evidencia-input" id="comp_e_' + idx + '" rows="1" placeholder="Evidências...">' + (v.evidencias || '') + '</textarea></td>';
                html += '</tr>';
            });

            html += '</tbody></table></div>';

            html += '<div class="comp-legend" style="margin-top:12px;">';
            html += '<span>1 = Insuficiente</span><span>2 = Abaixo</span><span>3 = Regular</span><span>4 = Bom</span><span>5 = Excelente</span>';
            html += '</div>';

            openModal('Avaliação por Competências', html, [
                { text: 'Cancelar', onclick: 'closeModal()', class: 'btn-secondary' },
                { text: 'Salvar', onclick: 'saveCompetencia(' + (compDocId ? '"' + compDocId + '"' : 'null') + ')', class: 'btn-primary' }
            ]);
        }

        async function saveCompetencia(compDocId) {
            var fichaSelect = document.getElementById('compFichaSelect');
            var fichaId = fichaSelect.value || fichaSelect.getAttribute('value');
            var fichaName = '';
            if (fichaSelect.tagName === 'SELECT' && fichaSelect.selectedOptions[0]) {
                fichaName = fichaSelect.selectedOptions[0].getAttribute('data-nome') || '';
            } else {
                fichaName = fichaSelect.getAttribute('data-nome') || '';
            }

            if (!fichaId) { showToast('warn', 'Atenção', 'Selecione um colaborador.'); return; }

            var criterios = {};
            var hasAny = false;
            CRITERIOS_COMPETENCIA.forEach(function(cr, idx) {
                var gVal = parseInt(document.getElementById('comp_g_' + idx).value) || 0;
                var rVal = parseInt(document.getElementById('comp_r_' + idx).value) || 0;
                var eVal = document.getElementById('comp_e_' + idx).value.trim();
                if (gVal > 5) gVal = 5; if (gVal < 0) gVal = 0;
                if (rVal > 5) rVal = 5; if (rVal < 0) rVal = 0;

                if (gVal || rVal || eVal) {
                    hasAny = true;
                    criterios[cr] = {};
                    if (gVal) criterios[cr].gestor = gVal;
                    if (rVal) criterios[cr].rh = rVal;
                    if (eVal) criterios[cr].evidencias = eVal;
                }
            });

            if (!hasAny) { showToast('warn', 'Atenção', 'Preencha pelo menos um critério.'); return; }

            try {
                var payload = {
                    ficha_id: fichaId,
                    colaborador_nome: fichaName,
                    criterios: criterios,
                    data_atualizacao: new Date(),
                    atualizado_por: currentUser.nome
                };

                if (compDocId) {
                    await db.collection('avaliacoes_competencias').doc(compDocId).update(payload);
                } else {
                    payload.criado_por = currentUser.id;
                    payload.data_criacao = new Date();
                    await db.collection('avaliacoes_competencias').add(payload);
                }

                invalidateCache('avaliacoes_competencias:');
                showToast('success', 'Avaliação salva!', '');
                closeModal();
                loadCompetencias();
            } catch (error) {
                console.error('Erro ao salvar competência:', error);
                showToast('error', 'Erro', error.message);
            }
        }

        function deleteCompetencia(docId) {
            showConfirm('⚠️', 'Excluir Avaliação', 'Tem certeza que deseja excluir esta avaliação por competências?', 'Excluir', async function() {
                try {
                    await db.collection('avaliacoes_competencias').doc(docId).delete();
                    invalidateCache('avaliacoes_competencias:');
                    showToast('success', 'Avaliação excluída', '');
                    loadCompetencias();
                } catch (error) {
                    showToast('error', 'Erro', error.message);
                }
            });
        }

        function openModal(title, body, buttons) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = body;

            const buttonsContainer = document.getElementById('modalButtons');
            buttonsContainer.innerHTML = '';

            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'btn ' + btn.class;
                button.textContent = btn.text;
                button.onclick = () => {
                    eval(btn.onclick);
                };
                buttonsContainer.appendChild(button);
            });

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>
</body>
</html>
